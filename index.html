<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PoE 2 Build Nexus</title>
<style>
body{margin:0;background:#080b10;color:#edf2f8;font:14px system-ui}
.load{padding:32px;max-width:700px;margin:10vh auto;background:#10151e;border:1px solid #303b50;border-radius:12px}
</style>
</head>
<body>
<div class="load" id="load"><h2>PoE 2 Build Nexus</h2><p>Loading Atziri Temple Planner V8.10…</p></div>
<script>
(async()=>{
  try{
    if(!('DecompressionStream' in window)) throw new Error('This browser is too old for the compressed site loader.');
    const parts=['00','01','02','03','04','05','06','07'];
    const b64=(await Promise.all(parts.map(n=>fetch('./site/part-'+n+'.txt?v=8.10').then(r=>{
      if(!r.ok) throw new Error('Missing site payload '+n);
      return r.text();
    })))).join('');
    const bin=atob(b64), bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('load').innerHTML='<h2>Could not load Build Nexus</h2><p>'+e.message+'</p>';
  }
})();
</script>
</body>
</html>
