<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoE 2 Build Nexus</title></head><body style="margin:0;background:#080b10;color:#edf2f8;font-family:system-ui"><div id="loading" style="padding:32px">Loading PoE 2 Build Nexus…</div><script>
